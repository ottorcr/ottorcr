name: Guatemala 1954 · narración y publicación

# Genera la narración, empaqueta la animación en un solo index.html y, en main, la publica
# en GitHub Pages (requisito único: Settings → Pages → Source: "GitHub Actions").
#
# Voz de la narración, en orden de preferencia:
#   1. grabaciones propias en guatemala-1954/grabaciones/ (00.wav … 19.wav, ver grabar.html)
#   2. voz guatemalteca de Azure, si existen los secretos AZURE_SPEECH_KEY y AZURE_SPEECH_REGION
#      (y opcionalmente la variable de repositorio AZURE_VOZ: es-GT-AndresNeural o es-GT-MartaNeural)
#   3. Piper es_MX-claude-high (voz neuronal abierta, acento mexicano)

on:
  push:
    branches: [main]
    paths: ['guatemala-1954/**', '.github/workflows/guatemala-1954.yml']
  pull_request:
    paths: ['guatemala-1954/**', '.github/workflows/guatemala-1954.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guatemala-1954-${{ github.ref }}
  cancel-in-progress: true

env:
  VOZ_URL: https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high
  VOZ: es_MX-claude-high

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: guatemala-1954
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar lame
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lame

      - name: Elegir voz
        id: voz
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
        run: |
          if [ -f grabaciones/00.wav ] || [ -f grabaciones/00.mp3 ]; then echo "motor=grabaciones" >> "$GITHUB_OUTPUT"
          elif [ -n "$AZURE_SPEECH_KEY" ]; then echo "motor=azure" >> "$GITHUB_OUTPUT"
          else echo "motor=piper" >> "$GITHUB_OUTPUT"; fi

      - name: Instalar Piper y descargar voz ${{ env.VOZ }}
        if: steps.voz.outputs.motor == 'piper'
        run: |
          pip install piper-tts
          mkdir -p voces
          curl -fsSL --retry 3 -o "voces/$VOZ.onnx" "$VOZ_URL/$VOZ.onnx"
          curl -fsSL --retry 3 -o "voces/$VOZ.onnx.json" "$VOZ_URL/$VOZ.onnx.json"

      - name: Generar narración (${{ steps.voz.outputs.motor }})
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          AZURE_VOZ: ${{ vars.AZURE_VOZ || 'es-GT-AndresNeural' }}
        run: |
          case "${{ steps.voz.outputs.motor }}" in
            grabaciones) python3 tools/narrar.py --motor grabaciones --dir grabaciones ;;
            azure)       python3 tools/narrar.py --motor azure --voz "$AZURE_VOZ" ;;
            piper)       python3 tools/narrar.py --motor piper --modelo "voces/$VOZ.onnx" ;;
          esac

      - name: Empaquetar index.html autocontenido
        run: python3 build.py --salida dist/index.html

      - name: Subir paquete descargable
        uses: actions/upload-artifact@v4
        with:
          name: guatemala-1954
          path: |
            guatemala-1954/dist/
            guatemala-1954/audio/

      - name: Preparar artefacto de Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: guatemala-1954/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
