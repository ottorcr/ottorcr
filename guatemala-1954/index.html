<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guatemala 1954</title>
<meta name="description" content="Animación histórica: la Primavera Democrática, el gobierno de Jacobo Árbenz y el golpe de Estado de 1954 respaldado por Estados Unidos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14110d;
    --panel: #1d1914;
    --paper: #efe4cc;
    --ink: #f3ead6;
    --muted: #b7a98c;
    --line: #3a3228;
    --sky: #4a9fd8;      /* azul de la bandera */
    --green: #6fae5a;
    --gold: #d9a441;
    --red: #c8442f;
    --usa: #8fa3c7;
    --shadow: rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line); gap: 12px;
  }
  header.top h1 {
    font-family: "Playfair Display", serif; font-size: 18px; margin: 0; letter-spacing: .02em;
  }
  header.top h1 span { color: var(--sky); }
  .flag { display: inline-flex; height: 12px; width: 30px; margin-right: 10px; vertical-align: -1px; border-radius: 2px; overflow: hidden; }
  .flag i { flex: 1; } .flag i:nth-child(1), .flag i:nth-child(3) { background: var(--sky); } .flag i:nth-child(2) { background: #fff; }
  .toplinks { display: flex; gap: 8px; }

  main.stage {
    flex: 1; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: 28px; padding: 28px clamp(16px, 4vw, 48px); align-items: center;
    max-width: 1280px; width: 100%; margin: 0 auto;
  }
  .art {
    position: relative; aspect-ratio: 3 / 2; width: 100%;
    background: radial-gradient(ellipse at 50% 30%, #2a241c, #16130f 75%);
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
    box-shadow: 0 20px 60px var(--shadow);
  }
  .art svg { width: 100%; height: 100%; display: block; }
  .art::after { /* grano de película */
    content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .08; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    animation: grain .6s steps(3) infinite;
  }
  @keyframes grain { 0%{transform:translate(0,0)} 50%{transform:translate(-8px,5px)} 100%{transform:translate(4px,-6px)} }

  .text { min-width: 0; }
  .year {
    font-family: "Playfair Display", serif; font-weight: 800;
    font-size: clamp(48px, 8vw, 104px); line-height: .95; color: var(--gold);
  }
  .kicker { font-family: "IBM Plex Mono", monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--sky); margin: 14px 0 6px; }
  .title { font-family: "Playfair Display", serif; font-size: clamp(24px, 3vw, 36px); margin: 0 0 14px; line-height: 1.15; }
  .body { color: var(--muted); font-size: clamp(15px, 1.35vw, 17px); line-height: 1.6; }
  .body p { margin: 0 0 10px; }
  .body strong { color: var(--ink); font-weight: 600; }
  .fact { display: inline-block; margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--gold); background: var(--panel); color: var(--ink); font-size: 14px; }

  .reveal > * { opacity: 0; transform: translateY(14px); animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
  .reveal > *:nth-child(1) { animation-delay: .05s } .reveal > *:nth-child(2) { animation-delay: .25s }
  .reveal > *:nth-child(3) { animation-delay: .45s } .reveal > *:nth-child(4) { animation-delay: .75s }
  .reveal > *:nth-child(5) { animation-delay: 1.05s }
  @keyframes rise { to { opacity: 1; transform: none; } }

  footer.controls {
    border-top: 1px solid var(--line); padding: 12px 20px 16px;
  }
  .progress { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
  .progress > div { height: 100%; width: 0; background: linear-gradient(90deg, var(--sky), var(--gold)); }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
  .btns { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 14px; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; cursor: pointer;
  }
  button:hover { border-color: var(--muted); }
  button[aria-pressed="true"] { border-color: var(--sky); color: var(--sky); }
  .timeline { display: flex; gap: 4px; flex: 1; min-width: 0; justify-content: center; flex-wrap: wrap; }
  .timeline button {
    padding: 4px 8px; font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); background: transparent; border-color: transparent;
  }
  .timeline button.on { color: var(--gold); border-color: var(--gold); }

  /* utilidades de animación SVG */
  .draw { stroke-dasharray: var(--len, 1000); stroke-dashoffset: var(--len, 1000); animation: draw var(--d, 2s) ease forwards; animation-delay: var(--delay, 0s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade { opacity: 0; animation: fade 1s ease forwards; animation-delay: var(--delay, 0s); }
  @keyframes fade { to { opacity: 1; } }
  .pop { transform-box: fill-box; transform-origin: center; transform: scale(0); animation: pop .6s cubic-bezier(.3,1.6,.5,1) forwards; animation-delay: var(--delay, 0s); }
  @keyframes pop { to { transform: scale(1); } }
  .up { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: up 1.2s ease forwards; animation-delay: var(--delay, 0s); }
  @keyframes up { to { transform: scaleY(1); } }
  .sway { transform-box: fill-box; transform-origin: bottom center; animation: sway 3s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  @media (max-width: 860px) {
    main.stage { grid-template-columns: 1fr; gap: 18px; padding: 16px; align-items: start; }
    .year { font-size: 56px; }
    .toplinks .hide-sm { display: none; }
    .timeline { flex-basis: 100%; order: -1; justify-content: flex-start; }
    .btns { width: 100%; justify-content: center; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<header class="top">
  <h1><span class="flag"><i></i><i></i><i></i></span>Guatemala <span>1944–1954</span></h1>
  <div class="toplinks">
    <button id="narrate" aria-pressed="false" title="Narración por voz (si el navegador la soporta)">🔈 Narración</button>
    <button id="sourcesBtn" class="hide-sm" title="Ir a fuentes">Fuentes</button>
  </div>
</header>

<main class="stage">
  <div class="art" id="art" aria-hidden="true"></div>
  <section class="text" id="text" aria-live="polite"></section>
</main>

<footer class="controls">
  <div class="progress"><div id="bar"></div></div>
  <div class="row">
    <div class="btns">
      <button id="prev" aria-label="Escena anterior">◀</button>
      <button id="play" aria-label="Pausar">❚❚</button>
      <button id="next" aria-label="Escena siguiente">▶</button>
    </div>
    <nav class="timeline" id="timeline" aria-label="Línea de tiempo"></nav>
  </div>
</footer>

<script>
/* ---------- Piezas de ilustración reutilizables ---------- */
const volcanoes = (y = 330) => `
  <path d="M0 ${y} L110 ${y-150} L140 ${y-160} L175 ${y-140} L290 ${y} Z" fill="#2c2620"/>
  <path d="M180 ${y} L330 ${y-200} L360 ${y-205} L385 ${y-190} L520 ${y} Z" fill="#241f19"/>
  <path d="M400 ${y} L500 ${y-120} L525 ${y-125} L600 ${y-70} L600 ${y} Z" fill="#2c2620"/>
  <rect y="${y}" width="600" height="${400-y}" fill="#1c1813"/>`;

const person = (x, y, s = 1, color = '#d9c9a8', armUp = false) => `
  <g transform="translate(${x} ${y}) scale(${s})" fill="${color}">
    <circle cx="0" cy="-34" r="7"/>
    <rect x="-7" y="-26" width="14" height="26" rx="5"/>
    ${armUp ? `<rect x="5" y="-48" width="4" height="24" rx="2" transform="rotate(15 7 -24)"/>` : ''}
  </g>`;

const bananaPlant = (x, y, s = 1, delay = 0) => `
  <g transform="translate(${x} ${y}) scale(${s})">
    <g class="up" style="--delay:${delay}s">
      <rect x="-3" y="-60" width="6" height="60" fill="#6b5a36"/>
      <g class="sway">
        <path d="M0 -58 C -30 -80 -50 -70 -58 -55 C -35 -62 -18 -60 0 -54Z" fill="#5c9a47"/>
        <path d="M0 -58 C 30 -84 52 -72 60 -58 C 36 -64 18 -60 0 -54Z" fill="#6fae5a"/>
        <path d="M0 -58 C -8 -90 8 -100 14 -96 C 6 -86 4 -72 0 -56Z" fill="#7cbd63"/>
        <ellipse cx="6" cy="-48" rx="6" ry="9" fill="#d9c441"/>
      </g>
    </g>
  </g>`;

const plane = (fill = '#8fa3c7') => `
  <g fill="${fill}">
    <path d="M0 0 L60 -4 L70 0 L60 4 Z"/>
    <path d="M28 -2 L18 -26 L26 -26 L42 -2 Z"/>
    <path d="M28 2 L18 26 L26 26 L42 2 Z"/>
    <path d="M2 -1 L-4 -12 L4 -12 L10 -1 Z"/>
  </g>`;

/* ---------- Escenas ---------- */
const scenes = [
  {
    year: '1944–1954', kicker: 'Una animación histórica', dur: 10,
    title: 'La Primavera Democrática y su final',
    body: `<p>Durante diez años Guatemala vivió un experimento democrático sin precedentes en su historia. Terminó en 1954 con un golpe de Estado <strong>organizado y financiado por el gobierno de Estados Unidos</strong>.</p>
           <p>Esta es la historia de <strong>Jacobo Árbenz</strong>, la reforma agraria y la operación de la CIA que lo derrocó.</p>`,
    say: 'Entre 1944 y 1954, Guatemala vivió diez años de primavera democrática. Terminaron con un golpe de Estado organizado y financiado por el gobierno de Estados Unidos.',
    art: () => `
      <svg viewBox="0 0 600 400">
        <defs><radialGradient id="sun"><stop offset="0" stop-color="#f3c85a"/><stop offset="1" stop-color="#d9a441" stop-opacity="0"/></radialGradient></defs>
        <g style="animation: sunrise 6s ease-out forwards; transform: translateY(160px)">
          <circle cx="300" cy="190" r="140" fill="url(#sun)" opacity=".5"/>
          <circle cx="300" cy="190" r="48" fill="#f0c257"/>
        </g>
        <style>@keyframes sunrise { to { transform: translateY(0); } }</style>
        ${volcanoes()}
        <g class="fade" style="--delay:1.5s">
          <rect x="210" y="355" width="60" height="22" fill="#4a9fd8"/><rect x="270" y="355" width="60" height="22" fill="#f3ead6"/><rect x="330" y="355" width="60" height="22" fill="#4a9fd8"/>
        </g>
      </svg>`
  },
  {
    year: '1944', kicker: 'Revolución de Octubre', dur: 11,
    title: 'Cae la dictadura',
    body: `<p>Tras 13 años de dictadura de <strong>Jorge Ubico</strong>, maestros, estudiantes y trabajadores salen a las calles. Ubico renuncia en julio y, el <strong>20 de octubre de 1944</strong>, un levantamiento cívico-militar derroca a su sucesor.</p>
           <p>En las primeras elecciones libres gana el maestro <strong>Juan José Arévalo</strong> (1945–1951): nueva Constitución, Código de Trabajo, seguro social y autonomía universitaria.</p>`,
    say: 'En 1944, maestros, estudiantes y trabajadores derrocan a la dictadura de Jorge Ubico. El maestro Juan José Arévalo gana las primeras elecciones libres y aprueba el Código de Trabajo y el seguro social.',
    art: () => {
      let crowd = '';
      for (let row = 0; row < 3; row++)
        for (let i = 0; i < 14; i++) {
          const x = 30 + i * 41 + (row % 2) * 20, y = 300 + row * 34;
          crowd += `<g class="fade" style="--delay:${(row * 0.3 + i * 0.06).toFixed(2)}s">${person(x, y, 1 + row * 0.12, row === 2 ? '#e8dbbd' : '#bfae8c', (i + row) % 3 === 0)}</g>`;
        }
      return `
      <svg viewBox="0 0 600 400">
        <rect x="120" y="60" width="360" height="140" fill="none"/>
        <g class="fade" style="--delay:.3s">
          <path d="M120 90 L480 90 L470 150 L130 150 Z" fill="#c8442f"/>
          <text x="300" y="130" text-anchor="middle" font-family="Playfair Display" font-size="30" font-weight="800" fill="#f3ead6">¡LIBERTAD!</text>
          <line x1="125" y1="90" x2="125" y2="300" stroke="#8b7a5c" stroke-width="4"/>
          <line x1="475" y1="90" x2="475" y2="300" stroke="#8b7a5c" stroke-width="4"/>
        </g>
        ${crowd}
        <text x="300" y="45" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#b7a98c" class="fade" style="--delay:2s">20 · X · 1944</text>
      </svg>`;
    }
  },
  {
    year: '1951', kicker: 'Elecciones de 1950', dur: 11,
    title: 'Jacobo Árbenz llega al poder',
    body: `<p>El coronel <strong>Jacobo Árbenz Guzmán</strong>, uno de los líderes de la revolución, gana las elecciones de noviembre de 1950 con alrededor del <strong>65 % de los votos</strong> y asume el 15 de marzo de 1951.</p>
           <p>Su programa: modernizar la economía, construir una carretera y un puerto propios en el Atlántico, una hidroeléctrica… y sobre todo, una <strong>reforma agraria</strong>.</p>`,
    say: 'En 1950, Jacobo Árbenz gana las elecciones con cerca del sesenta y cinco por ciento de los votos. Su programa central: una reforma agraria.',
    art: () => {
      let ballots = '';
      for (let i = 0; i < 9; i++) {
        const x = 250 + (i % 3) * 40, d = (i * 0.35).toFixed(2);
        ballots += `<rect x="${x}" y="40" width="26" height="34" rx="2" fill="#efe4cc" style="animation: drop 1.1s ease-in ${d}s forwards; opacity:0"/>`;
      }
      return `
      <svg viewBox="0 0 600 400">
        <style>@keyframes drop { 0%{opacity:0; transform:translateY(-20px)} 15%{opacity:1} 90%{opacity:1; transform:translateY(130px)} 100%{opacity:0; transform:translateY(140px)} }
               @keyframes fill65 { to { width: 234px; } }</style>
        ${ballots}
        <rect x="220" y="190" width="160" height="110" rx="6" fill="#3a3228" stroke="#8b7a5c" stroke-width="2"/>
        <rect x="260" y="186" width="80" height="8" rx="3" fill="#14110d"/>
        <text x="300" y="255" text-anchor="middle" font-family="IBM Plex Mono" font-size="14" fill="#b7a98c">VOTO</text>
        <g class="fade" style="--delay:3.2s">
          <rect x="120" y="330" width="360" height="22" rx="4" fill="#2a241c"/>
          <rect x="120" y="330" width="0" height="22" rx="4" fill="#4a9fd8" style="animation: fill65 2s ease 3.4s forwards"/>
          <text x="120" y="372" font-family="IBM Plex Mono" font-size="13" fill="#b7a98c">Árbenz ≈ 65 %</text>
          <text x="480" y="372" text-anchor="end" font-family="IBM Plex Mono" font-size="13" fill="#b7a98c">otros</text>
        </g>
      </svg>`;
    }
  },
  {
    year: 'El Pulpo', kicker: 'United Fruit Company', dur: 12,
    title: 'Una empresa con poder de Estado',
    body: `<p>La estadounidense <strong>United Fruit Company</strong> —llamada “El Pulpo”— era el mayor terrateniente de Guatemala. Gran parte de sus tierras estaba <strong>sin cultivar</strong>.</p>
           <p>Además controlaba el ferrocarril (IRCA) y el principal puerto del Atlántico, Puerto Barrios, y pagaba muy pocos impuestos gracias a concesiones de las dictaduras anteriores.</p>`,
    say: 'La United Fruit Company, conocida como El Pulpo, era el mayor terrateniente del país, y controlaba el ferrocarril y el principal puerto del Atlántico. Gran parte de sus tierras estaban sin cultivar.',
    art: () => {
      let plants = '';
      [60, 130, 200, 270, 340, 410, 480, 550].forEach((x, i) => plants += bananaPlant(x, 250, 0.9, i * 0.15));
      let tentacles = '';
      for (let i = 0; i < 8; i++) {
        const a = -Math.PI + (i + 0.5) * Math.PI / 8;
        const ex = 300 + Math.cos(a) * 280, ey = 105 - Math.sin(a) * -90 + 60;
        tentacles += `<path class="draw" style="--len:420;--d:2.4s;--delay:${1.5 + i * 0.1}s" d="M300 110 Q ${300 + Math.cos(a) * 130} ${150 + i % 2 * 30} ${ex.toFixed(0)} ${ey.toFixed(0)}" stroke="#a8453a" stroke-width="${7 - Math.abs(i - 3.5)}" fill="none" stroke-linecap="round" opacity=".9"/>`;
      }
      return `
      <svg viewBox="0 0 600 400">
        <style>@keyframes train { from { transform: translateX(-260px) } to { transform: translateX(640px) } }</style>
        <rect y="250" width="600" height="150" fill="#1f1b15"/>
        ${plants}
        <line x1="0" y1="330" x2="600" y2="330" stroke="#5b4e3b" stroke-width="3"/>
        <line x1="0" y1="340" x2="600" y2="340" stroke="#5b4e3b" stroke-width="3"/>
        <g style="animation: train 7s linear 1s infinite; transform: translateX(-260px)">
          <rect x="0" y="300" width="60" height="30" rx="3" fill="#3f6fa0"/><rect x="40" y="288" width="18" height="14" fill="#3f6fa0"/>
          <rect x="66" y="304" width="52" height="26" fill="#6d5a3a"/><rect x="124" y="304" width="52" height="26" fill="#6d5a3a"/><rect x="182" y="304" width="52" height="26" fill="#6d5a3a"/>
          <text x="92" y="322" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#efe4cc">UFCo</text>
          <text x="150" y="322" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#efe4cc">UFCo</text>
          <text x="208" y="322" text-anchor="middle" font-family="IBM Plex Mono" font-size="10" fill="#efe4cc">UFCo</text>
        </g>
        ${tentacles}
        <g class="pop" style="--delay:1.2s">
          <ellipse cx="300" cy="80" rx="62" ry="50" fill="#b8503f"/>
          <circle cx="280" cy="85" r="8" fill="#14110d"/><circle cx="320" cy="85" r="8" fill="#14110d"/>
          <text x="300" y="60" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="16" fill="#efe4cc">UFCo</text>
        </g>
      </svg>`;
    }
  },
  {
    year: '1952', kicker: 'Decreto 900 · 17 de junio', dur: 13,
    title: 'La Reforma Agraria',
    body: `<p>El <strong>Decreto 900</strong> expropió únicamente <strong>tierras ociosas</strong> de las grandes fincas y las repartió entre campesinos. Los dueños eran indemnizados con bonos según el valor que ellos mismos habían declarado para pagar impuestos.</p>
           <p>Unas <strong>100 000 familias</strong> recibieron tierra. A la United Fruit se le expropiaron cerca de 400 000 acres; el gobierno ofreció unos <strong>US$ 627 000</strong>, mientras Washington reclamó casi <strong>US$ 16 millones</strong> en su nombre.</p>`,
    say: 'El Decreto novecientos expropió las tierras ociosas de las grandes fincas y las repartió entre unas cien mil familias campesinas. Entre las tierras expropiadas estaban cientos de miles de acres de la United Fruit.',
    art: () => {
      let plots = '';
      const cols = 10, rows = 5;
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
          const i = r * cols + c, x = 40 + c * 52, y = 70 + r * 44;
          const idle = (i * 7) % 10 < 7;
          plots += `<rect x="${x}" y="${y}" width="46" height="38" rx="3" fill="#3a3228" ${idle ? `style="animation: toGreen .6s ease ${(1.5 + i * 0.05).toFixed(2)}s forwards"` : ''}/>`;
          if (idle && i % 3 === 0) plots += `<g class="fade" style="--delay:${(2.2 + i * 0.05).toFixed(2)}s">${person(x + 23, y + 34, 0.55, '#efe4cc')}</g>`;
        }
      return `
      <svg viewBox="0 0 600 400">
        <style>@keyframes toGreen { to { fill: #5c9a47; } }</style>
        <text x="40" y="52" font-family="IBM Plex Mono" font-size="13" fill="#b7a98c" class="fade">TIERRA OCIOSA → TIERRA CULTIVADA</text>
        ${plots}
        <g class="fade" style="--delay:3.5s">
          <text x="300" y="340" text-anchor="middle" font-family="Playfair Display" font-weight="800" font-size="40" fill="#d9a441" id="counter">0</text>
          <text x="300" y="366" text-anchor="middle" font-family="IBM Plex Mono" font-size="13" fill="#b7a98c">familias beneficiadas (aprox.)</text>
        </g>
      </svg>`;
    },
    onEnter(root) {
      const el = root.querySelector('#counter'); if (!el) return;
      const start = performance.now() + 3500, target = 100000;
      const tick = t => {
        if (!el.isConnected) return;
        const p = Math.min(1, Math.max(0, (t - start) / 2500));
        el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3))).toLocaleString('es-GT');
        if (p < 1) requestAnimationFrame(tick);
      };
      requestAnimationFrame(tick);
    }
  },
  {
    year: 'Washington', kicker: 'Guerra Fría', dur: 13,
    title: 'Intereses cruzados',
    body: `<p>En plena Guerra Fría, el gobierno de <strong>Eisenhower</strong> presentó la reforma como una amenaza comunista. Los hermanos Dulles —<strong>John Foster</strong>, secretario de Estado, y <strong>Allen</strong>, director de la CIA— tenían vínculos previos con la United Fruit a través del bufete Sullivan &amp; Cromwell.</p>
           <p>La empresa contrató al publicista <strong>Edward Bernays</strong> para una campaña de prensa que retrató a Guatemala como una “cabeza de playa soviética”.</p>`,

/* ---------- Motor de la animación ---------- */
const $ = id => document.getElementById(id);
const art = $('art'), text = $('text'), bar = $('bar'), timeline = $('timeline');
let idx = 0, playing = true, elapsed = 0, last = performance.now(), narrate = false;

scenes.forEach((s, i) => {
  const b = document.createElement('button');
  b.textContent = s.year.length > 10 ? s.year.split('–')[0] : s.year;
  b.title = s.title;
  b.onclick = () => go(i);
  timeline.appendChild(b);
});

function speak(s) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  if (!narrate || !s.say) return;
  const u = new SpeechSynthesisUtterance(s.say);
  u.lang = 'es-MX';
  const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.startsWith('es'));
  if (v) u.voice = v;
  u.rate = 1;
  speechSynthesis.speak(u);
}

function go(i) {
  idx = (i + scenes.length) % scenes.length;
  const s = scenes[idx];
  elapsed = 0;
  art.innerHTML = s.art();
  text.innerHTML = `<div class="reveal">
      <div class="year">${s.year}</div>
      <div class="kicker">${s.kicker}</div>
      <h2 class="title">${s.title}</h2>
      <div class="body">${s.body}</div>
    </div>`;
  if (s.onEnter) s.onEnter(art);
  [...timeline.children].forEach((b, j) => b.classList.toggle('on', j === idx));
  speak(s);
}

function setPlaying(p) {
  playing = p;
  $('play').textContent = p ? '❚❚' : '►';
  $('play').setAttribute('aria-label', p ? 'Pausar' : 'Reproducir');
  document.querySelectorAll('.art *').forEach(el => el.style.animationPlayState = p ? 'running' : 'paused');
  if ('speechSynthesis' in window) p ? speechSynthesis.resume() : speechSynthesis.pause();
}

function loop(t) {
  const dt = (t - last) / 1000; last = t;
  if (playing) {
    elapsed += dt;
    const d = scenes[idx].dur;
    if (elapsed >= d) {
      if (idx < scenes.length - 1) go(idx + 1); else { elapsed = d; setPlaying(false); }
    }
  }
  bar.style.width = ((idx + Math.min(1, elapsed / scenes[idx].dur)) / scenes.length * 100) + '%';
  requestAnimationFrame(loop);
}

$('prev').onclick = () => go(idx - 1);
$('next').onclick = () => go(idx + 1);
$('play').onclick = () => {
  if (!playing && idx === scenes.length - 1 && elapsed >= scenes[idx].dur) go(0);
  setPlaying(!playing);
};
$('sourcesBtn').onclick = () => go(scenes.findIndex(s => s.sources));
$('narrate').onclick = () => {
  narrate = !narrate;
  $('narrate').setAttribute('aria-pressed', narrate);
  $('narrate').textContent = narrate ? '🔊 Narración' : '🔈 Narración';
  elapsed = 0;
  speak(scenes[idx]);
};
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') go(idx + 1);
  else if (e.key === 'ArrowLeft') go(idx - 1);
  else if (e.key === ' ') { e.preventDefault(); $('play').click(); }
});
document.addEventListener('visibilitychange', () => { last = performance.now(); });

go(0);
requestAnimationFrame(loop);
</script>
